nt-size="10" fill="#858196">400 · 500 · 600 · 700</text><text x="0" y="453" font-size="10" letter-spacing="1.5" fill="#8f7bff">04 / SPACING & GRID</text><g transform="translate(0 467)"><rect width="884" height="32" rx="5" fill="#171722"/><path d="M8 6V26M16 6V26M24 6V26M32 6V26M48 6V26M64 6V26M80 6V26M112 6V26M144 6V26M192 6V26" stroke="#9380ff" stroke-opacity=".85"/><text x="228" y="20" font-size="10" fill="#b6b2c7">4px · 8px · 12px · 16px · 24px · 32px</text></g><rect x="0" y="522" width="884" height="73" rx="5" fill="#171722"/><text x="16" y="543" font-size="10" letter-spacing="1.2" fill="#8f7bff">CONFIDENCE NOTES</text><text x="16" y="563" font-size="11" fill="#bcb9cd">Computed values are observed. Semantic roles, missing breakpoints, and some component states are inferred.</text><text x="16" y="580" font-size="11" fill="#bcb9cd">Contrast ratios compare sampled colors against pure white and black; this is not a full WCAG audit.</text></g>
